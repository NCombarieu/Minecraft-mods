# Pour chaque push et chaque pull request : cherche des secrets, compile les trois mods
# et lance leurs tests (tests unitaires et tests en jeu).

name: build
on: [pull_request, push]

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: cherche des secrets dans les fichiers suivis
        run: outils/chercher-secrets.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/
            chronomancie/build/libs/
            hameau/build/libs/
