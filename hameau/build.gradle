plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '0.6.1'
base {
	archivesName = 'hameau'
}

repositories {
	mavenCentral()
}

configurations {
	// Le SDK Anthropic et toutes ses dépendances, à embarquer dans le jar du mod
	sdk
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	sdk "com.anthropic:anthropic-java:2.34.0"
	implementation "com.anthropic:anthropic-java:2.34.0"
}

// « include » n'est pas transitif : on y ajoute une à une les dépendances résolues du SDK.
configurations.sdk.resolvedConfiguration.resolvedArtifacts.each { artefact ->
	def id = artefact.moduleVersion.id
	// Minecraft fournit déjà slf4j
	if (id.name == 'slf4j-api') return
	dependencies.add('include', "${id.group}:${id.name}:${id.version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_hameau" }
	}
}
