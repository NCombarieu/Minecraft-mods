pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'premiermod'

// Deuxième mod : Chronomancie (dossier chronomancie/)
include 'chronomancie'

// Troisième mod : Hameau, les villageois animés par Claude (dossier hameau/)
include 'hameau'
